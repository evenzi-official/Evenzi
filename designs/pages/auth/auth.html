<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="../../favicon.ico" sizes="48x48" />
<link rel="apple-touch-icon" href="../../apple-touch-icon.png" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Evenzi · Log in or Sign up</title>
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
<meta name="description" content="Sign in or create your Evenzi account with phone OTP or Google." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="../../shared/shell.css" />
<link rel="stylesheet" href="auth.css" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
</head>
<body data-page="auth" class="page-bg page-shell">

<header class="page-shell-header">
  <a href="../../index.html" class="page-logo" aria-label="Evenzi home">Evenzi</a>
  <div class="page-shell-actions">
    <button id="theme-toggle" type="button" class="page-theme-toggle" aria-label="Toggle dark mode">
      <span aria-hidden="true" class="material-symbols-outlined theme-icon-light">dark_mode</span>
      <span aria-hidden="true" class="material-symbols-outlined theme-icon-dark">light_mode</span>
    </button>
    <a href="mailto:evenzi.official@gmail.com" class="page-help">Need help?</a>
  </div>
</header>

<main class="page-main page-main-center">
  <section class="auth-card clay-card" aria-labelledby="auth-title">
    <div class="auth-card-head">
      <h1 class="auth-card-title" id="auth-title" aria-live="polite" data-title>Log in to your Evenzi account</h1>
      <p class="auth-card-lead" data-lead>Welcome back. Enter your number to continue.</p>
    </div>

    <div class="nav-tabs auth-tabs" role="radiogroup" aria-label="Auth mode">
      <button type="button" role="radio" class="nav-tab" aria-checked="false" data-auth-mode="signup">
        <span class="nav-tab-label">Sign Up</span>
      </button>
      <button type="button" role="radio" class="nav-tab is-active" aria-checked="true" data-auth-mode="login">
        <span class="nav-tab-label">Log In</span>
      </button>
    </div>

    <div class="form-group">
      <label class="form-label" for="phone">Phone Number</label>
      <div class="form-input form-input-group">
        <span class="form-input-prefix" aria-hidden="true" data-prefix-focus="phone">+91</span>
        <input id="phone" class="form-input-field" type="tel" inputmode="numeric"
               autocomplete="tel" placeholder="9999999999" maxlength="10" aria-describedby="phone-err"/>
      </div>
      <p class="form-error" id="phone-err" role="alert" hidden></p>
    </div>

    <button type="button" class="btn-pill btn-pill-primary btn-pill-lg" data-send-otp>
      <span>Send OTP</span>
      <span aria-hidden="true" class="btn-pill-spinner"></span>
    </button>

    <div class="divider-or"><span>or</span></div>

    <button type="button" class="btn-google" data-google aria-label="Continue with Google">
      <svg class="btn-google-icon" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
      </svg>
      <span>Continue with Google</span>
      <span aria-hidden="true" class="btn-pill-spinner"></span>
    </button>

    <p class="auth-policy">
      <!-- href="#" placeholders: /legal/terms and /legal/privacy pages are not built yet. -->
      By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
    </p>
  </section>
</main>

<footer class="page-shell-footer">
  © 2026 Evenzi · All rights reserved
</footer>

<div id="bc-toast" class="bc-toast" role="status" aria-live="polite">
  <span class="bc-live" aria-hidden="true"></span>
  <span id="bc-toast-text">OTP SENT</span>
</div>

<script src="../../shared/shell.js"></script>
<script src="auth.js"></script>
</body>
</html>
